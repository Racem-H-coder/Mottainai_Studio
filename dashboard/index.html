<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Tameru</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4C24 4 9 20 9 30a15 15 0 0 0 30 0C39 20 24 4 24 4Z' fill='none' stroke='%2356c8f0' stroke-width='3'/%3E%3Cpath d='M26.5 17 19 30h6l-2.5 10L31 26h-6l1.5-9Z' fill='%233ddc97'/%3E%3C/svg%3E" />
    <style>
      /* Loading state, visible until React mounts (the single-file build parses ~2 MB first). */
      html, body { margin: 0; background: #F7F5F0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: Inter, system-ui, "Segoe UI", sans-serif; color: #15171B; }
      .boot-in { display: grid; justify-items: center; gap: 12px; }
      .boot svg { width: 40px; height: 40px; }
      .boot-wm { font-weight: 700; font-size: 24px; }
      .boot-s { font-size: 18px; color: #43474F; }
      .boot-bar { width: 160px; height: 2px; background: #DEDAD1; border-radius: 2px; overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #1D64A8; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-in">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 4C24 4 9 20 9 30a15 15 0 0 0 30 0C39 20 24 4 24 4Z" stroke="#1D64A8" stroke-width="2.4"/><path d="M26.5 17 19 30h6l-2.5 10L31 26h-6l1.5-9Z" fill="#1D64A8"/></svg>
          <div class="boot-wm">Tameru</div>
          <div class="boot-bar"><i></i></div>
          <div class="boot-s">Loading district data (simulated)</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
